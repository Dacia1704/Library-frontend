

<!-- Stats Cards -->
<div class="header__stats">
  <!-- Category Stat -->
  <div class="stat-card stat-card--category">
    <div class="stat-card__icon">
      <span class="material-symbols-outlined">folder_copy</span>
    </div>
    <div class="stat-card__content">
      <span class="stat-card__label">Tổng danh mục</span>
      <div class="stat-card__value">
        <span class="stat-card__number">{{ stats.categoryCount }}</span>
        <span class="stat-card__unit">phân loại</span>
      </div>
    </div>
    <div class="stat-card__decoration">
      <span class="material-symbols-outlined">category</span>
    </div>
  </div>

  <!-- Author Stat -->
  <div class="stat-card stat-card--author">
    <div class="stat-card__icon">
      <span class="material-symbols-outlined">draw</span>
    </div>
    <div class="stat-card__content">
      <span class="stat-card__label">Tổng tác giả</span>
      <div class="stat-card__value">
        <span class="stat-card__number">{{ stats.authorCount }}</span>
        <span class="stat-card__unit">hồ sơ tác giả</span>
      </div>
    </div>
    <div class="stat-card__decoration">
      <span class="material-symbols-outlined">person_edit</span>
    </div>
  </div>

  <!-- Publisher Stat -->
  <div class="stat-card stat-card--publisher">
    <div class="stat-card__icon">
      <span class="material-symbols-outlined">domain</span>
    </div>
    <div class="stat-card__content">
      <span class="stat-card__label">Tổng nhà xuất bản</span>
      <div class="stat-card__value">
        <span class="stat-card__number">{{ stats.publisherCount }}</span>
        <span class="stat-card__unit">đơn vị xuất bản</span>
      </div>
    </div>
    <div class="stat-card__decoration">
      <span class="material-symbols-outlined">apartment</span>
    </div>
  </div>

</div>

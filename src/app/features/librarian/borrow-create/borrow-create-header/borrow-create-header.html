<header class="header">
  <div class="header__info">
    <div class="header__title-row">
      <h1 class="header__title">Lập phiếu mượn sách</h1>
    </div>
    <p class="header__subtitle">
      Tiếp nhận thẻ bạn đọc, kiểm tra điều kiện mượn sách và quét chọn ấn phẩm cho độc giả.
    </p>
  </div>

  <div class="header__actions">
    <button class="header__btn" type="button" (click)="onRefresh.emit()">
      <span class="material-symbols-outlined header__btn-icon">refresh</span>
      <span>Làm mới quầy</span>
    </button>
    <button class="header__btn" type="button">
      <span class="material-symbols-outlined header__btn-icon">history</span>
      <span>Nhật ký giao dịch</span>
    </button>
  </div>
</header>

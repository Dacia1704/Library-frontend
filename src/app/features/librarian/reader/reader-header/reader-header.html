<header class="reader-header">
  <div class="reader-header__title-group">
    <div class="reader-header__title-row">
      <h1 class="reader-header__title">Quản lý hồ sơ độc giả</h1>
      <span class="reader-header__badge">CSDL Quốc gia v2.4</span>
    </div>
    <p class="reader-header__desc">
      Tìm kiếm, quản lý danh sách độc giả thư viện, cấp phát thẻ thành viên và kiểm soát trạng thái tài khoản.
    </p>
  </div>

  <div class="reader-header__stats">
    <div class="reader-header__chip reader-header__chip--primary">
      <span class="material-symbols-outlined reader-header__chip-icon">group</span>
      <span class="reader-header__chip-text">
        Tổng số độc giả: <strong>{{ totalElements() }}</strong>
      </span>
    </div>
  </div>
</header>

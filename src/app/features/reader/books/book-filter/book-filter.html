<section class="filter-panel">

  <!-- Search Row -->
  <div class="search-row">
    <div class="search-input-wrap">
      <span class="material-symbols-outlined search-icon">search</span>
      <input
        id="book-search-input"
        class="search-input"
        type="text"
        placeholder="Tìm theo tên sách, tác giả, chuyên đề hoặc từ khóa..."
        [(ngModel)]="filter.search"
        (keyup.enter)="search()"
      />
      @if (filter.search) {
        <button class="clear-btn" type="button" (click)="filter.search = ''; search()">
          <span class="material-symbols-outlined">close</span>
        </button>
      }
    </div>
  </div>

  <!-- Filter Row 2: Multi-select Categories -->
  <div class="filter-row filter-row-multi">

    <!-- Category Multi-select -->
    <div class="filter-field filter-field-multi">
      <label class="filter-label">
        <span class="material-symbols-outlined lbl-icon">category</span>
        Danh mục lĩnh vực
      </label>
      <div class="multi-select-wrap">
        <button class="multi-select-btn" type="button" (click)="toggleDropdown('category')">
          @if (filter.categoryIds.length === 0) {
            <span class="placeholder">Tất cả danh mục</span>
          } @else {
            <span>{{ filter.categoryIds.length }} danh mục</span>
          }
          <span class="material-symbols-outlined">expand_more</span>
        </button>
        @if (dropdownOpen() === 'category') {
          <div class="multi-dropdown">
            @for (cat of categories(); track cat.id) {
              <label class="multi-option">
                <input 
                  type="checkbox" 
                  [checked]="isSelected('categoryIds', cat.id)"
                  (change)="toggleSelection('categoryIds', cat.id)"
                />
                <span>{{ cat.name }}</span>
              </label>
            }
          </div>
        }
      </div>
    </div>

    <!-- Author Multi-select -->
    <div class="filter-field filter-field-multi">
      <label class="filter-label">
        <span class="material-symbols-outlined lbl-icon">person</span>
        Tác giả
      </label>
      <div class="multi-select-wrap">
        <button class="multi-select-btn" type="button" (click)="toggleDropdown('author')">
          @if (filter.authorIds.length === 0) {
            <span class="placeholder">Tất cả tác giả</span>
          } @else {
            <span>{{ filter.authorIds.length }} tác giả</span>
          }
          <span class="material-symbols-outlined">expand_more</span>
        </button>
        @if (dropdownOpen() === 'author') {
          <div class="multi-dropdown">
            @for (a of authors(); track a.id) {
              <label class="multi-option">
                <input 
                  type="checkbox" 
                  [checked]="isSelected('authorIds', a.id)"
                  (change)="toggleSelection('authorIds', a.id)"
                />
                <span>{{ a.name }}</span>
              </label>
            }
          </div>
        }
      </div>
    </div>

    <!-- Publisher Multi-select -->
    <div class="filter-field filter-field-multi">
      <label class="filter-label">
        <span class="material-symbols-outlined lbl-icon">domain</span>
        Nhà xuất bản
      </label>
      <div class="multi-select-wrap">
        <button class="multi-select-btn" type="button" (click)="toggleDropdown('publisher')">
          @if (filter.publisherIds.length === 0) {
            <span class="placeholder">Tất cả nhà xuất bản</span>
          } @else {
            <span>{{ filter.publisherIds.length }} NXB</span>
          }
          <span class="material-symbols-outlined">expand_more</span>
        </button>
        @if (dropdownOpen() === 'publisher') {
          <div class="multi-dropdown">
            @for (p of publishers(); track p.id) {
              <label class="multi-option">
                <input 
                  type="checkbox" 
                  [checked]="isSelected('publisherIds', p.id)"
                  (change)="toggleSelection('publisherIds', p.id)"
                />
                <span>{{ p.name }}</span>
              </label>
            }
          </div>
        }
      </div>
    </div>

  </div>

  <!-- Filter Row 3: Range Sliders -->
  <div class="filter-row filter-row-range">

    <!-- Year Range Slider -->
    <div class="filter-field filter-field-range">
      <label class="filter-label">
        <span class="material-symbols-outlined lbl-icon">calendar_today</span>
        Năm xuất bản: {{ filter.yearFrom ?? minYear }} - {{ filter.yearTo ?? maxYear }}
      </label>
      <div class="range-slider-wrap">
        <input
          type="range"
          class="range-input range-min"
          [min]="minYear"
          [max]="maxYear"
          [(ngModel)]="filter.yearFrom"
          (input)="onYearMinChange()"
        />
        <input
          type="range"
          class="range-input range-max"
          [min]="minYear"
          [max]="maxYear"
          [(ngModel)]="filter.yearTo"
          (input)="onYearMaxChange()"
        />
        <div class="range-track">
          <div class="range-fill" [style.left.%]="yearMinPercent()" [style.right.%]="100 - yearMaxPercent()"></div>
        </div>
      </div>
    </div>

    <!-- Quantity Range Slider -->
    <div class="filter-field filter-field-range">
      <label class="filter-label">
        <span class="material-symbols-outlined lbl-icon">inventory_2</span>
        Số lượng: {{ filter.minQuantity ?? 0 }} - {{ filter.maxQuantity ?? maxQuantity }}
      </label>
      <div class="range-slider-wrap">
        <input
          type="range"
          class="range-input range-min"
          [min]="0"
          [max]="maxQuantity"
          [(ngModel)]="filter.minQuantity"
          (input)="onQuantityMinChange()"
        />
        <input
          type="range"
          class="range-input range-max"
          [min]="0"
          [max]="maxQuantity"
          [(ngModel)]="filter.maxQuantity"
          (input)="onQuantityMaxChange()"
        />
        <div class="range-track">
          <div class="range-fill" [style.left.%]="quantityMinPercent()" [style.right.%]="100 - quantityMaxPercent()"></div>
        </div>
      </div>
    </div>

    <!-- Available Range Slider -->
    <div class="filter-field filter-field-range">
      <label class="filter-label">
        <span class="material-symbols-outlined lbl-icon">check_circle</span>
        Số lượng hiện có: {{ filter.minAvailable ?? 0 }} - {{ filter.maxAvailable ?? maxAvailable }}
      </label>
      <div class="range-slider-wrap">
        <input
          type="range"
          class="range-input range-min"
          [min]="0"
          [max]="maxAvailable"
          [(ngModel)]="filter.minAvailable"
          (input)="onAvailableMinChange()"
        />
        <input
          type="range"
          class="range-input range-max"
          [min]="0"
          [max]="maxAvailable"
          [(ngModel)]="filter.maxAvailable"
          (input)="onAvailableMaxChange()"
        />
        <div class="range-track">
          <div class="range-fill" [style.left.%]="availableMinPercent()" [style.right.%]="100 - availableMaxPercent()"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Action Buttons Row -->
  <div class="filter-actions">
    <button class="btn-reset" type="button" (click)="reset()">
      <span class="material-symbols-outlined">restart_alt</span>
      <span>Đặt lại</span>
    </button>
    <button class="btn-search" type="button" (click)="search()">
      <span class="material-symbols-outlined">search</span>
      <span>Tìm kiếm</span>
    </button>
  </div>

</section>

<div class="pagination-strip">
  <div class="info">
    <span class="material-symbols-outlined info-icon">info</span>
    <span>
      Hiển thị <strong>{{ from }} - {{ to }}</strong> của <strong>{{ total }} phiếu mượn</strong>
      • Trang {{ page }}/{{ totalPages }}
    </span>
  </div>

  <div class="actions">
    <button
      class="page-btn"
      type="button"
      [disabled]="page === 1"
      (click)="goTo(page - 1)"
    >
      <span class="material-symbols-outlined">chevron_left</span>
    </button>

    @for (p of pageNumbers; track p) {
      @if (p === -1) {
        <span class="ellipsis">...</span>
      } @else {
        <button
          class="page-btn num"
          [class.active]="p === page"
          type="button"
          (click)="goTo(p)"
        >{{ p }}</button>
      }
    }

    <button
      class="page-btn"
      type="button"
      [disabled]="page === totalPages"
      (click)="goTo(page + 1)"
    >
      <span class="material-symbols-outlined">chevron_right</span>
    </button>
  </div>
</div>
